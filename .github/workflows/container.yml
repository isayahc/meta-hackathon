name: Container and recovery
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: docker compose config --quiet
      - name: Exercise container startup and recovery from a Windows build context
        run: |
          sed -i 's/$/\r/' docker/entrypoint.sh
          python3 docker/smoke.py
