name: MongoDB and S3 migration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      STORAGE_ACCESS_KEY: test-only-access
      STORAGE_SECRET_KEY: test-only-secret-not-production
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.storage.yaml --profile tools build
      - run: docker builder prune --all --force
      - run: docker compose -f compose.storage.yaml run --rm transfer
      - run: docker compose -f compose.storage.yaml run --rm -e FIELDOPS_TEST_ASSETS=1 transfer node --test app/physical-task-tracker/dist/lib/s3-assets.test.js
      - run: FIELDOPS_MONGO_PASSWORD=test-compose-only docker compose -f compose.mongo.yaml -f compose.assets.yaml config --quiet
      - if: failure()
        run: docker compose -f compose.storage.yaml logs --tail 100
      - if: always()
        run: docker compose -f compose.storage.yaml down -v
